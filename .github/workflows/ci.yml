# Caller of the shared-ci fail-closed quality gate. `quality / aggregate` fails
# unless every selected lane passed on the PR head SHA. The separate review.yml
# caller runs Codex review on this repository's self-hosted runner. Lanes:
#   verify  macOS: scripts/verify --all (contract checks, Tokens and Swift layers)
#   test    Linux: scripts/verify --layer Tokens (keeps the ubuntu Node/Chrome coverage)
#   contract, workflow-lint: shared-ci audits at the pinned SHA
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: LeePepe/shared-ci/.github/workflows/quality.yml@6e354f476bc53d68f0f09fc231d5cd938466af9c
    with:
      runs-on: macos-15
      setup-command: scripts/ci/setup.sh
      verify-command: scripts/verify --all
      test-command: scripts/verify --layer Tokens
      test-runs-on: ubuntu-24.04
      contract-audit: true
      workflow-lint: true
      timeout-minutes: 30
